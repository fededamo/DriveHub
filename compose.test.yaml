services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drivehub_test
      POSTGRES_USER: drivehub_test
      POSTGRES_PASSWORD: ${DRIVEHUB_TEST_DB_PASSWORD:?set a temporary test password}
    ports:
      - "127.0.0.1:${DRIVEHUB_TEST_DB_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivehub_test -d drivehub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
