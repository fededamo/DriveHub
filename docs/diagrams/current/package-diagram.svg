ss-business e class-presentation.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.8887" x="17" y="592.7764">dao include DatabaseManager; dao.postgres realizza i contratti e fa mapping.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487.5869" x="17" y="609.0732">DAO/servizi/eventi espongono Connection: non indipendenti da JDBC.</text></g><?plantuml-src PLHBRjH04DtFAOgi00qUiM6HI4WXGoGYaKIAaDZMs6LFaNQrqnzdCWY9Gt00xi9DE0dLjXlPoc8qhl-hrw_xHUUmQH4CFjaOmBSKK73bxrawTDY2tsDb7raQgD5ucaKggZ6QS6abtF6HuEsxMR33yXuRkWjFXi1HgLqRGwl0GMqEHHIkkQWSzxIFE_ZxynTKt95K9DggTfWxh46iG6sYzrP7CbGOU3K5uQHpv4c2-gmKFTFZ2Q27oF3zn_yaJwxdakQkohR8il2WdPidQXUTzQ7H0KFFhfd7gTUfoo5bT1oU5as-OO_reNWzDAWFpsA5Vp13JFzJK74NnViCE9iZs6pLXrLUQ0YYNTfZyjmrO5ruCjYbyy6i4WkpBjbC8Tq_pykVOz9afPoHbMo93GGx6u9jmTOv7U2Zg0p-_-nPHuD7myfdDJaeB3418rDKABNQVlJsgd16qcsZQ3rZJ5TrO6jdG9qOT69vyERmPBVb52UZNWQllXOb32g85_?></g></svg>