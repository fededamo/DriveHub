FFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1164,848.9219 L1164,858.9219 L1174,858.9219 L1164,848.9219" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="432.4297" x="515.1914" y="868.7734">Filtra per clientId; non aggiunge un controllo isFuture.</text><g class="message" data-entity-1="part2" data-entity-2="part6" id="msg13"><polygon fill="#181818" points="1099.4258,903.1719,1109.4258,907.1719,1099.4258,911.1719,1103.4258,907.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="361.0195" x2="1105.4258" y1="907.1719" y2="907.1719"/><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="22.2656" x="368.0195" y="901.3984">13</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="149.9922" x="394.2852" y="901.3984">delete(testDriveId,</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="5.0859" x="544.2773" y="901.3984">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="45.1094" x="549.3633" y="901.3984">conn)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg14"><line style="stroke:#181818;stroke-width:1;" x1="737.9414" x2="779.9414" y1="939.7969" y2="939.7969"/><line style="stroke:#181818;stroke-width:1;" x1="779.9414" x2="779.9414" y1="939.7969" y2="952.7969"/><line style="stroke:#181818;stroke-width:1;" x1="738.9414" x2="779.9414" y1="952.7969" y2="952.7969"/><polygon fill="#181818" points="748.9414,948.7969,738.9414,952.7969,748.9414,956.7969,744.9414,952.7969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="22.2656" x="744.9414" y="934.0234">14</text><text fill="#