rif" font-size="16" lengthAdjust="spacing" textLength="70.3438" x="583.8031" y="471.8359">WAITING</text><g class="end_entity" data-qualified-name=".end." data-source-line="18" id="ent0009"><ellipse cx="456.8031" cy="595.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="456.8031" cy="595.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="23" id="ent0003"><path d="M486.3031,563.2969 L486.3031,629.1719 A0,0 0 0 0 486.3031,629.1719 L1075.2953,629.1719 A0,0 0 0 0 1075.2953,629.1719 L1075.2953,573.2969 L1065.2953,563.2969 L768.104,563.2969 L659.2553,476.927 L760.104,563.2969 L486.3031,563.2969 A0,0 0 0 0 486.3031,563.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1065.2953,563.2969 L1065.2953,573.2969 L1075.2953,573.2969 L1065.2953,563.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="318.4141" x="492.3031" y="583.1484">VIN nuovo in cessione: creato WAITING.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="546.4453" x="492.3031" y="601.7734">La UI manager propone SALE/RENT; addVehicle riceve VehicleState.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="567.9922" x="492.3031" y="620.3984">Non c'&#232; uno stato iniziale universale o uno stato noleggio COMPLETED.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="28" id="ent0006"><path d="M462.8031,284.2969 L462.8031,368.7969 A0,0 0 0 0 462.8031,368.7969 L1003.0453,368.7969 A0,0 0 0 0 1003.0453,368.7969 L1003.0453,294.2969 L993.0453,284.2969 L716.7015,284.2969 L656.7518,206.8152 L708.7015,284.2969 L462.8031,284.2969 A0,0 0 0 0 462.8031,284.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M993.0453,284.2969 L993.0453,294.2969 L1003.0453,294.2969 L993.0453,284.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="460.3516" x="468.8031" y="304.1484">Ogni transizione &#232; parte della transazione del caso d'uso:</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="519.2422" x="468.8031" y="322.7734">fallimento tenta rollback anche di saldi, richieste e cancellazioni.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="465.5469" x="468.8031" y="341.3984">Cambio destinazione vietato da BLOCKED/SOLD/WAITING.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="495.4844" x="468.8031" y="360.0234">Vehicle.setState da solo non impone questa macchina a stati.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk2"><polygon fill="#181818" points="589.1545,181.2252,580.7421,176.1035,584.1958,180.5836,579.7156,184.0374,589.1545,181.2252" style="stroke:#181818;stroke-width:1;"/><path d="M529.6397,75.0659 C511.7974,79.9026 489.0945,89.3437 477.8031,107.2969 C468.1017,122.7219 466.5344,133.9768 477.8031,148.2969 C491.4572,165.6484 542.3157,175.1655 583.2041,180.4553" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="128.9609" x="480.2406" y="124.1484">initiatePurchase</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="129.8359" x="479.8031" y="142.7734">acconto e totale</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk3"><polygon fill="#181818" points="421.2105,306.7391,427.0793,298.8298,422.3023,301.8597,419.2723,297.0828,421.2105,306.7391" style="stroke:#181818;stroke-width:1;"/><pat