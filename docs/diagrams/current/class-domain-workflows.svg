sans-serif" font-size="16" lengthAdjust="spacing" textLength="394.8594" x="167" y="672.0234">Esito finale: richiesta eliminata nella transazione.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="87" id="ent0031"><path d="M778.5,596.2969 L778.5,680.7969 A0,0 0 0 0 778.5,680.7969 L1340.1016,680.7969 A0,0 0 0 0 1340.1016,680.7969 L1340.1016,606.2969 L1330.1016,596.2969 L1090.7194,596.2969 L1153.1785,493.9093 L1082.7194,596.2969 L778.5,596.2969 A0,0 0 0 0 778.5,596.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1330.1016,596.2969 L1330.1016,606.2969 L1340.1016,606.2969 L1330.1016,596.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="540.6016" x="784.5" y="616.1484">Vincoli importi: PURCHASE &gt;=0, ACQUISITION &lt;=0, PENALTY &gt;=0.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="456.1484" x="784.5" y="634.7734">Penale senza veicolo/venditore. Collegamenti tramite ID.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="462.1328" x="784.5" y="653.3984">Rent/TestDrive non hanno stati REQUESTED/COMPLETED.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="371.3594" x="784.5" y="672.0234">Factory statiche; nessuna BaseEntity comune.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="extension" id="lnk15"><polygon fill="none" points="1008.9771,190.2914,1027.8494,192.2493,1025.2497,180.5343,1008.9771,190.2914" style="stroke:#181818;stroke-width:1;"/><path d="M1306.2213,124.3283 C1223.0563,142.7839 1120.7455,165.4882 1026.5496,186.3918" fill="none" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="extension" id="lnk16"><polygon fill="n