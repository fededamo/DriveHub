<text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="392.3896" x="17" y="794.5889">da noleggio in corso. Futuri cancellati e rimborsati100%</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331.6523" x="17" y="810.8857">nella stessa transazione; altri stati non riaperti.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="340.5527" x="17" y="827.1826">Entrambi i ruoli hanno gestione identit&#224; e logout</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="420.4648" x="17" y="843.4795">(diagramma cliente/identit&#224;). Solo il cliente ricarica il conto.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="332.0625" x="17" y="859.7764">Non esistono ordini StockOrder, manutenzione,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="366.8574" x="17" y="876.0732">offerta del venditore poi approvazione del manager,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="442.8389" x="17" y="892.3701">n&#233; gestione degli stati di noleggi/test drive da parte dello staff.</text></g><?plantuml-src TLJ1ZXGt4BtFLnH822B1BbouS1hD3h0IBClEWXHfBZNkwfuIRbTZkoVA8gISzWCYFY3NV0T_ib-Iv-wXCoEIGqljib_LywjNljT5RbecpxzRdocraZdmp4kTAHj5RRQPAetYibgOfKyQEexSKjfoPRzfQAXcd-HWfvAQUvzVMiWhlH5wzdoMDNkX1IUbwc6VZ9p5A24htVtnZLBckfwnonRfeuHAyIFxzLkmQIJE2W4E3RASHTt9wtv3NsP4VHB7IUZ-ma92KOu2pcwhahAiWmPAbZf9TfyuqML97ff3tBphekqAx1J0MlkIOXtOVUurGO1AF3clu2fZYZwwBP17EPoJd7_AuIGbQ2O_vLYnFy8lkDreWLTWhO5l2ceTLlCtIxgx_KPNoulh0NWsxW-TEC2_Ac70MmOtNQDYQwZfTG2zBV_fY6_JQ1-WQY4iNblaB8Hteiwy4ivPg8ns6ifwoF9Hjkgy7ELPEMbmBQJPb3NtsLgGSxmE1ZAXnpr7qT0I-I_62OKo68zy3NH63cExpXJxVSZ_rsTfqA9eLEXQ2zmwN7wuMhoUhvR8D5-y_t2-Ehy-VtU1rUNoOlxc-jSXxzK0XAc-pYQxqPCdapsEWpyQVXGTMdWKEUpDthGbl5V_838fUH0R1Je8