44" x="604" y="355.1484">+setAutoCommit(autoCommit: boolean): void</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="130.7031" x="604" y="373.7734">+commit(): void</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="133.5078" x="604" y="392.3984">+rollback(): void</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="111.4375" x="604" y="411.0234">+close(): void</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="48" id="ent0026"><path d="M996,315.2969 L996,399.7969 A0,0 0 0 0 996,399.7969 L1548.0078,399.7969 A0,0 0 0 0 1548.0078,399.7969 L1548.0078,325.2969 L1538.0078,315.2969 L1168.2792,315.2969 L965.3098,238.3823 L1160.2792,315.2969 L996,315.2969 A0,0 0 0 0 996,315.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1538.0078,315.2969 L1538.0078,325.2969 L1548.0078,325.2969 L1538.0078,315.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="419.6797" x="1002" y="335.1484">Callback riuscito: commit; eccezione: tenta rollback;</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="456.7656" x="1002" y="353.7734">errore di rollback conservato come eccezione soppressa.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="496.9688" x="1002" y="372.3984">Il servizio passa la stessa connessione alle scritture/Observer.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="531.0078" x="1002" y="391.0234">Argomenti omessi (...) per leggibilit&#224;: firme complete nei sorgenti.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="54" id="ent0029"><path d="M6,315.2969 L6,399.7969 A0,0 0 0 0 6,399.7969 L535.7031,399.79