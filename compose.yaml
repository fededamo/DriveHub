services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DRIVEHUB_DB_NAME:-drivehub}
      POSTGRES_USER: ${DRIVEHUB_DB_USER:-drivehub}
      POSTGRES_PASSWORD: ${DRIVEHUB_DB_PASSWORD:?set DRIVEHUB_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRIVEHUB_DB_USER:-drivehub} -d ${DRIVEHUB_DB_NAME:-drivehub}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - drivehub-postgres:/var/lib/postgresql/data

volumes:
  drivehub-postgres:
